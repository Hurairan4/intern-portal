{% extends "auth_base.html" %}
{% block content %}
<h3 class="mb-1">Create your account</h3>
<p class="muted mb-4">It takes a minute. You can edit your profile later.</p>
<form method="post">
  {% csrf_token %}
  {% include "_form.html" %}
  <button class="btn-main w-100 mt-2">Create account</button>
</form>
<p class="mt-4 muted">Already registered? <a href="{% url 'login' %}">Log in</a></p>
{% endblock %}
