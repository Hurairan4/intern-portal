<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Internee Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  :root{--navy:#0F2A43;--teal:#0E8F83;--teal-dark:#0A6F66;--amber:#F5B83D;
        --bg:#F4F7FA;--line:#DCE4EC;--text:#1B2B3A;--muted:#5F7183}
  body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text)}
  h1,h2,h3,h4,.brand,.avatar{font-family:'Bricolage Grotesque',sans-serif;letter-spacing:-.02em}
  .topbar{background:var(--navy);padding:.8rem 0}
  .brand{color:#fff;font-weight:700;font-size:1.25rem;text-decoration:none;display:flex;align-items:center;gap:.6rem}
  .brand:hover{color:#fff}
  .brand-mark{width:26px;height:26px;border-radius:8px;background:var(--amber);display:inline-block}
  .card-box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:1.75rem}
  .btn-main{background:var(--teal);color:#fff;border:0;border-radius:10px;padding:.65rem 1.25rem;font-weight:700}
  .btn-main:hover{background:var(--teal-dark);color:#fff}
  .btn-nav{border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:10px;padding:.35rem .9rem;background:transparent;font-size:.9rem}
  .btn-nav:hover{background:rgba(255,255,255,.12);color:#fff}
  .form-control,.form-select{border-radius:10px;border:1px solid var(--line);padding:.65rem .85rem}
  .form-control:focus,.form-select:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(14,143,131,.2)}
  .form-label{font-weight:700;font-size:.9rem;margin-bottom:.3rem}
  .form-hint{color:var(--muted);font-size:.82rem;margin-top:.25rem}
  .field-error{color:#B42318;font-size:.85rem;margin-top:.25rem}
  .avatar{width:76px;height:76px;border-radius:50%;background:var(--navy);color:var(--amber);
          display:flex;align-items:center;justify-content:center;font-size:2rem;font-weight:700;flex-shrink:0}
  .badge-track{background:#E3F4F1;color:var(--teal-dark);font-weight:700;border-radius:999px;padding:.3rem .8rem;font-size:.85rem}
  .chip{background:#EEF2F6;border:1px solid var(--line);border-radius:999px;padding:.25rem .75rem;font-size:.85rem}
  .muted{color:var(--muted)}
  .auth-wrap{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}
  .auth-side{background-color:var(--navy);color:#fff;padding:4rem;display:flex;flex-direction:column;justify-content:center;
             background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),
                              linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);
             background-size:32px 32px}
  .auth-side h1{font-size:2.8rem;line-height:1.08;max-width:12ch}
  .auth-side p{color:#B9C8D6;max-width:34ch;margin-top:1rem}
  .auth-main{display:flex;align-items:center;justify-content:center;padding:2rem}
  .auth-form{width:100%;max-width:420px}
  @media(max-width:800px){
    .auth-wrap{grid-template-columns:1fr}
    .auth-side{padding:2rem}
    .auth-side h1{font-size:1.9rem}
  }
</style>
